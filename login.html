<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Sign in · Swimm Outbound Report · Amiy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#121821;--muted:#6b7480;--faint:#9aa2ad;--line:#e6eaf0;--line-2:#d7dde6;--blue:#034a92;--yellow:#f6ca13;--red:#c2410c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
    color:var(--ink);background:#f5f7fa;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:390px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 30px 26px;
    box-shadow:0 1px 2px rgba(18,24,33,.04),0 16px 44px rgba(18,24,33,.08)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .brand img{height:42px;width:42px;border-radius:12px}
  .brand .t{font-size:18px;font-weight:800;letter-spacing:-.02em}
  .brand .s{font-size:12.5px;color:var(--muted);font-weight:600}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px}
  input{width:100%;padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line-2);border-radius:11px;outline:none}
  input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(3,74,146,.12)}
  .f{margin-bottom:14px}
  button{width:100%;margin-top:8px;padding:13px;font:inherit;font-size:15px;font-weight:800;color:#fff;background:var(--blue);border:0;border-radius:11px;cursor:pointer}
  button:hover:not(:disabled){background:#0b5cb0}
  button:disabled{opacity:.6;cursor:default}
  .msg{display:none;margin-top:14px;font-size:13px;font-weight:600;padding:10px 12px;border-radius:10px}
  .msg.err{display:block;background:#fdeee6;color:var(--red)}
  .msg.info{display:block;background:#fdf5d3;color:#6b5600}
  .foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);text-align:center;font-weight:600}
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
  <div class="brand">
    <img src="https://media.base44.com/images/public/69e3ce3cfef2251bd195213a/e0b0e910d_AMIYlogo.png" alt="Amiy">
    <div><div class="t">Swimm outbound report</div><div class="s">Run by Amiy</div></div>
  </div>
  <div class="f"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required autofocus spellcheck="false"></div>
  <div class="f"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
  <button type="submit" id="go">Sign in</button>
  <div class="msg" id="msg"></div>
  <div class="foot">Private report · access by invitation</div>
</form>
<script>
(function(){
  var form=document.getElementById("form"),btn=document.getElementById("go"),msg=document.getElementById("msg");
  function say(t,k){msg.textContent=t;msg.className="msg "+(k||"err");}
  fetch("/api/login",{credentials:"same-origin"}).then(function(r){return r.json();}).then(function(j){if(j&&j.auth)location.replace("/");}).catch(function(){});
  form.addEventListener("submit",function(e){
    e.preventDefault();btn.disabled=true;btn.textContent="Signing in";msg.className="msg";
    fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(res.ok&&res.j.auth){say("Signed in","info");location.replace("/");return;}
      say((res.j&&res.j.error)||"Sign in failed.");btn.disabled=false;btn.textContent="Sign in";
      document.getElementById("password").value="";document.getElementById("password").focus();
    })
    .catch(function(){say("Couldn't reach the server. Try again.");btn.disabled=false;btn.textContent="Sign in";});
  });
})();
</script>
</body>
</html>
