<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Sign in to the Swimm outbound report by Amiy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--blue:#034a92;--navy:#022d5a;--yellow:#f6ca13;--ink:#121821;--slate:#6b7480;--faint:#a0a8b3;--mist:#e3e8ef}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);
    background:var(--blue);min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;isolation:isolate}
  :focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .side{position:relative;color:#fff;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .side::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,45,90,0) 30%,rgba(2,45,90,.6));z-index:-1}
  .logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}
  .logo img{width:40px;height:40px;border-radius:11px}
  .side h1{font-size:clamp(30px,3.6vw,48px);line-height:1.12;letter-spacing:-.03em;font-weight:600;color:rgba(255,255,255,.62);max-width:15ch;margin:0}
  .side h1 b{color:#fff;font-weight:800}
  .side h1 span{background:var(--yellow);color:var(--ink);border-radius:8px;padding:0 .15em;font-weight:800}
  .side svg{width:100%;height:90px;display:block;margin-top:34px}
  .side .s{font-size:13px;font-weight:600;color:rgba(255,255,255,.55)}
  .main{background:#f7f8fa;border-radius:28px 0 0 28px;display:flex;align-items:center;justify-content:center;padding:32px}
  form{width:100%;max-width:360px}
  form h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
  form p{margin:0 0 26px;color:var(--slate);font-weight:600;font-size:14px}
  label{display:block;font-size:13px;font-weight:700;color:var(--slate);margin:0 0 6px}
  input{width:100%;padding:13px 14px;font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--mist);border-radius:12px;outline:none}
  input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(3,74,146,.14)}
  .f{margin-bottom:14px}
  button{width:100%;margin-top:8px;padding:14px;font:inherit;font-size:15px;font-weight:800;color:#fff;background:var(--blue);border:0;border-radius:12px;cursor:pointer}
  button:hover:not(:disabled){background:#0b5cb0}
  button:disabled{opacity:.6;cursor:default}
  .msg{display:none;margin-top:14px;font-size:13px;font-weight:700;padding:10px 12px;border-radius:10px}
  .msg.err{display:block;background:#fbece6;color:#a7441f}
  .msg.info{display:block;background:#fff7d6;color:#6b5600}
  .fine{margin-top:22px;font-size:12.5px;color:var(--faint);font-weight:600}
  @media(max-width:820px){
    body{grid-template-columns:1fr}
    .side{padding:26px 24px 30px}
    .side h1{font-size:28px;margin-top:28px}
    .side svg{height:56px;margin-top:20px}
    .side .s{display:none}
    .main{border-radius:24px 24px 0 0;padding:32px 22px 44px}
  }
</style>
</head>
<body>
<aside class="side">
  <div class="logo"><img src="https://media.base44.com/images/public/69e3ce3cfef2251bd195213a/e0b0e910d_AMIYlogo.png" alt="" onerror="this.style.display='none'">amiy</div>
  <div>
    <h1>From <b>calls</b> to <b>meetings</b> to <span>SQLs</span>, for Swimm.</h1>
    <svg viewBox="0 0 1000 90" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#cfe0f3" stop-opacity=".9"/><stop offset=".85" stop-color="#f6ca13"/></linearGradient></defs>
      <path d="M0,2 C170,2 170,18 333,18 C500,18 500,32 666,32 C833,32 833,36 1000,36 L1000,54 C833,54 833,58 666,58 C500,58 500,72 333,72 C170,72 170,88 0,88 Z" fill="url(#g)"/>
    </svg>
  </div>
  <div class="s">Outbound run by Amiy. Updated every night.</div>
</aside>
<main class="main">
  <form id="form" autocomplete="on">
    <h2>Sign in</h2>
    <p>Use the email your invite was sent to.</p>
    <div class="f"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required autofocus spellcheck="false"></div>
    <div class="f"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
    <button type="submit" id="go">Sign in</button>
    <div class="msg" id="msg" role="alert"></div>
    <div class="fine">Private report. Ask your Amiy contact if you need access.</div>
  </form>
</main>
<script>
(function(){
  var form=document.getElementById("form"),btn=document.getElementById("go"),msg=document.getElementById("msg");
  function say(t,k){msg.textContent=t;msg.className="msg "+(k||"err");}
  fetch("/api/login",{credentials:"same-origin"}).then(function(r){return r.json();}).then(function(j){if(j&&j.auth)location.replace("/");}).catch(function(){});
  form.addEventListener("submit",function(e){
    e.preventDefault();btn.disabled=true;btn.textContent="Signing in";msg.className="msg";
    fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(res.ok&&res.j.auth){say("Signed in. Opening the report.","info");location.replace("/");return;}
      say((res.j&&res.j.error)||"Sign in didn't work. Check your email and password.");btn.disabled=false;btn.textContent="Sign in";
      document.getElementById("password").value="";document.getElementById("password").focus();
    })
    .catch(function(){say("The server didn't answer. Check your connection and try again.");btn.disabled=false;btn.textContent="Sign in";});
  });
})();
</script>
</body>
</html>
